# Render.com 배포 설정
# GitHub 저장소에 이 파일이 있으면 Render 가 아래 설정을 자동으로 읽습니다.
services:
  - type: web
    name: insta-photo-downloader
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120 --workers 1 --threads 8
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: SECRET_KEY
        generateValue: true
      # 아래 두 개는 Render 화면에서 직접 값을 넣습니다(비밀값이라 저장소에 남기지 않음).
      - key: ACCESS_CODE
        sync: false
      - key: INSTA_SESSIONID
        sync: false
