<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>접속 암호 · 인스타 사진 다운로더</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#f4f5f8;color:#171a20;padding:24px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",Roboto,"Noto Sans KR",sans-serif}
  .card{width:100%;max-width:380px;background:#fff;border-radius:18px;padding:24px;
    box-shadow:0 1px 2px rgba(16,24,40,.04),0 12px 28px -18px rgba(16,24,40,.25)}
  h1{margin:0 0 6px;font-size:19px;letter-spacing:-.02em}
  p{margin:0 0 16px;font-size:13px;color:#6b7280;line-height:1.55}
  input{width:100%;padding:14px;font-size:17px;border:1.5px solid #e6e8ee;border-radius:13px;
    outline:none;font-family:inherit;background:#fafbfc}
  input:focus{border-color:#7b5cff;background:#fff;box-shadow:0 0 0 3px rgba(123,92,255,.12)}
  button{width:100%;margin-top:12px;padding:15px;border:0;border-radius:13px;color:#fff;
    font-family:inherit;font-size:16px;font-weight:800;cursor:pointer;
    background:linear-gradient(120deg,#e1306c,#7b5cff)}
  .err{margin-top:12px;font-size:13px;color:#d92d20;font-weight:700}
</style>
</head>
<body>
  <form class="card" method="post">
    <h1>접속 암호</h1>
    <p>이 다운로더는 정해진 사람만 쓸 수 있도록 암호를 걸어 두었습니다. 암호를 입력해 주세요.</p>
    <input type="password" name="code" inputmode="numeric" autocomplete="current-password" autofocus placeholder="암호">
    <button type="submit">들어가기</button>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
  </form>
</body>
</html>
